# Unit and integration runs upload separately, flagged, and Codecov merges them
# per commit. The total shown on the badge is that merge.
codecov:
  notify:
    # Unit jobs (2 Go versions) + integration legs (TS3, TS6), one upload each.
    after_n_builds: 4

# Informational: coverage is reported on pull requests, never a gate.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  unit:
    carryforward: false
  integration-ts3:
    carryforward: false
  integration-ts6:
    carryforward: false

# Test fixtures and developer tools, not the library.
ignore:
  - "internal/livetest"
  - "internal/tools"
  - "stream/e2e"
  - "**/*_test.go"
