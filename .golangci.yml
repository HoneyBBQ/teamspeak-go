version: "2"

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
    - tagliatelle
    - testpackage
    - ireturn
    - containedctx
    - gochecknoglobals
    - paralleltest
    - tparallel
    - revive
    - mnd
    - goconst
    - gomodguard

  settings:
    govet:
      enable-all: true
    cyclop:
      max-complexity: 20
    gocyclo:
      min-complexity: 20
    funlen:
      lines: 60
      statements: 30
  exclusions:
    rules:
      - path: ".*_test\\.go"
        linters: [gosec]
        text: "G115"
      # Protocol uses SHA-1; field order is ASN.1-defined.
      - path: crypto/crypt.go
        linters: [gosec]
        text: "G401|G505"
      - path: crypto/crypt.go
        linters: [govet]
        text: "fieldalignment"
      # Protocol-defined struct layout; padding optimisation is non-functional.
      - path: handshake/license.go
        linters: [govet]
        text: "fieldalignment"
      # The command options structs are parameter bags, built once per call and
      # never in a hot path. Reordering their fields to save a few bytes of
      # padding would cost readability for no measurable gain, and the field
      # order mirrors the server's own documentation.
      - path: 'api_.*\.go'
        linters: [govet]
        text: "fieldalignment"
      - path: 'command_params\.go'
        linters: [govet]
        text: "fieldalignment"
      - path: 'types\.go'
        linters: [govet]
        text: "fieldalignment"
      - path: 'reconnect\.go'
        linters: [govet]
        text: "fieldalignment"
      # The Client struct carries a dozen unrelated pieces of session state and
      # is allocated once per connection, not per packet.
      - path: 'client\.go'
        linters: [govet]
        text: "fieldalignment"
      - path: handshake/crypt_handshake.go
        linters: [gosec]
        text: "G115"
      - path: discovery/resolver.go
        linters: [gosec]
        text: "G704"
      # Transport hot-path: method grouping and nesting follow protocol pipeline flow.
      - path: transport/handler.go
        linters: [funcorder, nestif]
      - path: transport/quicklz.go
        linters: [nestif]

run:
  timeout: 10m
  go: '1.26'
  tests: true
