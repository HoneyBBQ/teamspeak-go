version: "2"

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
    - tagliatelle
    - testpackage
    - ireturn
    - containedctx
    - gochecknoglobals
    - paralleltest
    - tparallel
    - mnd
    - goconst
    - gomodguard

  settings:
    govet:
      enable-all: true
    revive:
      # revive's default rules, with one argument changed below.
      enable-default-rules: true
      rules:
        # The stutter check reads client.ClientMovedEvent as client.Client...
        # repeated, but the two words name different things: the package is
        # this connection, and "Client" in an event's name is the other
        # client the event is about. client.MovedEvent would read as this
        # client having moved, which is the confusion the name prevents.
        - name: exported
          arguments:
            - disableStutteringCheck
    cyclop:
      max-complexity: 20
    gocyclo:
      min-complexity: 20
    funlen:
      lines: 60
      statements: 30
  exclusions:
    rules:
      - path: ".*_test\\.go"
        linters: [gosec]
        text: "G115"
      # The bodies passed to forEachTransport are tests, run once per transport,
      # not helpers: marking them helpers would report a failure at the runner's
      # line instead of the assertion's.
      - path: 'serverquery/integration_.*_test\.go'
        linters: [thelper]
      # The end-to-end test is a module of its own, and builds against this
      # checkout.
      - path: stream/e2e/go\.mod
        linters: [gomoddirectives]
      # The stream tests send text in other scripts and escapes, to see that it
      # arrives as it left, and draw their random numbers for load, not secrets.
      - path: 'stream/.*_test\.go'
        linters: [gosmopolitan]
      - path: 'stream/.*_test\.go'
        linters: [gosec]
        text: "G404"
      # The live, fuzz and stress scenarios of the stream package read top to
      # bottom, one protocol exchange each; splitting them would only scatter it.
      - path: 'stream/(live.*|fuzz|stress)_test\.go'
        linters: [funlen, gocognit]
      # The bodies passed to run in the stream tests are tests, run in a
      # synctest bubble over a fake client, not helpers.
      - path: 'stream/.*_test\.go'
        linters: [thelper]
      # Test rows hold made-up keys and passwords, in the fields that carry the
      # real ones.
      - path: ".*_test\\.go"
        linters: [gosec]
        text: "G101"
      # Protocol uses SHA-1; field order is ASN.1-defined.
      - path: crypto/crypt.go
        linters: [gosec]
        text: "G401|G505"
      - path: crypto/crypt.go
        linters: [govet]
        text: "fieldalignment"
      # The public key's ASN.1 encoding follows field order; reordering the
      # fields for padding would change every identity's public key.
      - path: identity/identity.go
        linters: [govet]
        text: "fieldalignment"
      # Protocol-defined struct layout; padding optimisation is non-functional.
      - path: handshake/license.go
        linters: [govet]
        text: "fieldalignment"
      # The command options structs are parameter bags, built once per call and
      # never in a hot path. Reordering their fields to save a few bytes of
      # padding would cost readability for no measurable gain, and the field
      # order mirrors the server's own documentation.
      - path: 'api_.*\.go'
        linters: [govet]
        text: "fieldalignment"
      - path: 'command_params\.go'
        linters: [govet]
        text: "fieldalignment"
      - path: 'types\.go'
        linters: [govet]
        text: "fieldalignment"
      - path: 'reconnect\.go'
        linters: [govet]
        text: "fieldalignment"
      # The Client struct carries a dozen unrelated pieces of session state and
      # is allocated once per connection, not per packet.
      - path: 'client\.go'
        linters: [govet]
        text: "fieldalignment"
      # errcode.Code is an error value, like syscall.Errno: the constants are
      # the server's codes, not sentinel errors, so an
      # ErrXxx prefix on all 196 of them would only add noise.
      - path: errcode/errcode.go
        linters: [errname]
      # Permission, command and property names such as
      # b_channel_modify_password, tokenadd or virtualserver_password, not
      # credentials.
      - path: '(perm/perm|commands/names|prop/prop)\.go'
        linters: [gosec]
        text: "G101"
      # The permission tables are two lists of names, one name per constant, and
      # the second repeats the shape of the first by design.
      - path: perm/perm.go
        linters: [dupl, lll]
      - path: handshake/crypt_handshake.go
        linters: [gosec]
        text: "G115"
      - path: discovery/resolver.go
        linters: [gosec]
        text: "G704"
      # Transport hot-path: method grouping and nesting follow protocol pipeline flow.
      - path: transport/handler.go
        linters: [funcorder, nestif]
      - path: transport/quicklz.go
        linters: [nestif]
      # A table of fixed values: each name is <Platform>_<version>_<build>, as
      # the version string reads, so the underscores are part of the name.
      - path: versions/versions\.go
        linters: [revive]
        text: "var-naming"

run:
  timeout: 10m
  go: '1.26'
  tests: true
  # Files behind the integration tag are linted with everything else.
  build-tags:
    - integration
