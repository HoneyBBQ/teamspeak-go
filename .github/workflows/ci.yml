name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      # The public API is recorded in api/*.txt and reviewed like code. This
      # fails, with a diff, when the code and the record disagree, so a change
      # to the API cannot land without showing up in the commit that makes it.
      # To accept a deliberate change: go run ./internal/tools/apidump
      - name: Public API report is current
        run: go run ./internal/tools/apidump -check

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic -short ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false

  # Both supported server generations, because they differ in ways that only
  # show up live: TS6 hashes client uids with SHA-256 where TS3 uses SHA-1.
  integration:
    name: Integration (${{ matrix.server.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: TS3
            image: teamspeak:latest
            # TS3 still serves raw ServerQuery on 10011.
            query_host: 127.0.0.1
            query_http: ""
            query_port: 10011
            api_key_env: TS3SERVER_LICENSE
          - name: TS6
            image: teamspeaksystems/teamspeak6-server:latest
            # TS6 dropped raw ServerQuery for HTTP, so the fixture talks
            # WebQuery here — the same commands over a different transport.
            query_host: ""
            query_http: 127.0.0.1:10080
            query_port: 10080
            api_key_env: TSSERVER_LICENSE_ACCEPTED
    services:
      teamspeak:
        image: ${{ matrix.server.image }}
        env:
          TS3SERVER_LICENSE: accept
          TSSERVER_LICENSE_ACCEPTED: accept
          TSSERVER_QUERY_HTTP_ENABLED: "1"
        ports:
          - 9987:9987/udp
          - 10011:10011
          - 10080:10080
          # File transfer: the server hands out this port with each transfer
          # key, so it must be reachable at the same number from the runner.
          - 30033:30033
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      - name: Wait for server to be ready
        run: sleep 15
      # The suite needs channels, permissions and relaxed antiflood. Skipping
      # this is how the tests pass while testing nothing: they skip on
      # permissions instead of failing, which hid a row-parsing bug for months.
      - name: Provision the fixture
        run: |
          sudo apt-get install -y netcat-openbsd >/dev/null
          TS3_QUERY_HOST='${{ matrix.server.query_host }}' \
          TS3_QUERY_HTTP='${{ matrix.server.query_http }}' \
          TS3_QUERY_PORT='${{ matrix.server.query_port }}' \
          ./scripts/ts3-fixture.sh
      - name: Run integration tests
        run: |
          set -a
          . ./ts3-fixture.env
          set +a
          go test -v -race -tags integration -timeout 300s ./...
