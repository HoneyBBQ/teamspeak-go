name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress. Runs on main and
# on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      # The public API is recorded in api/*.txt and reviewed like code. This
      # fails, with a diff, when the code and the record disagree, so a change
      # to the API cannot land without showing up in the commit that makes it.
      # To accept a deliberate change: go run ./internal/tools/apidump
      - name: Public API report is current
        run: go run ./internal/tools/apidump -check
      # A client version that was exported can be in use: a pull request may
      # add entries, never remove one.
      - name: No client version was removed
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin main
          if ! git cat-file -e origin/main:versions/versions.go 2>/dev/null; then
            echo "versions/versions.go is not on main yet"
            exit 0
          fi
          names() { grep -oE '^var [A-Za-z0-9_]+' | sort; }
          git show origin/main:versions/versions.go | names >"$RUNNER_TEMP/before"
          names <versions/versions.go >"$RUNNER_TEMP/after"
          removed=$(comm -23 "$RUNNER_TEMP/before" "$RUNNER_TEMP/after")
          if [ -n "$removed" ]; then
            echo "removed from versions/versions.go:"
            echo "$removed"
            exit 1
          fi

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The module requires 1.26; 1.27 is the current stable.
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic -short ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false

  # Both supported server generations, because they differ in ways that only
  # show up live: TS6 hashes client uids with SHA-256 where TS3 uses SHA-1.
  integration:
    name: Integration (${{ matrix.server.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: TS3
            image: teamspeak:latest
            # TS3 serves raw ServerQuery on 10011, and SSH and WebQuery once the
            # service below lists them in query_protocols. With a raw port the
            # fixture provisions over it and creates the WebQuery api key
            # there, since TS3 prints none; the suite then runs over all three.
            query_host: 127.0.0.1
            query_http: 127.0.0.1:10080
            query_port: 10011
            query_ssh_port: 10022
            # TS3 has no guest ServerQuery access.
            query_guest: ""
            api_key_env: TS3SERVER_LICENSE
          - name: TS6
            image: teamspeaksystems/teamspeak6-server:latest
            # TS6 dropped raw ServerQuery for HTTP, so the fixture talks
            # WebQuery here — the same commands over a different transport.
            query_host: ""
            query_http: 127.0.0.1:10080
            query_port: 10080
            # TS6 also serves ServerQuery over SSH, which is the transport that
            # carries the serveradmin password and checks the host key, so the
            # suite has to reach it. Off unless the service enables it below.
            query_ssh_port: 10022
            # TS6 serves guest ServerQuery access over SSH and WebQuery, on by
            # default, so the guest tests run here.
            query_guest: "1"
            api_key_env: TSSERVER_LICENSE_ACCEPTED
    services:
      teamspeak:
        image: ${{ matrix.server.image }}
        env:
          TS3SERVER_LICENSE: accept
          TSSERVER_LICENSE_ACCEPTED: accept
          # TS3 takes its query protocols as a list, and SSH ServerQuery logs in
          # with the serveradmin password, so it is set here to be known.
          TS3SERVER_QUERY_PROTOCOLS: raw,ssh,http
          TS3SERVER_SERVERADMIN_PASSWORD: ci-serveradmin-password
          # TS6 switches each on separately, and is given the same password.
          TSSERVER_QUERY_HTTP_ENABLED: "1"
          TSSERVER_QUERY_SSH_ENABLED: "1"
          TSSERVER_QUERY_ADMIN_PASSWORD: ci-serveradmin-password
        ports:
          - 9987:9987/udp
          - 10011:10011
          - 10080:10080
          - 10022:10022
          # File transfer: the server hands out this port with each transfer
          # key, so it must be reachable at the same number from the runner.
          - 30033:30033
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      # TS3 opens its SSH and HTTP ports a few seconds after the raw one, so
      # each port the suite uses is waited for.
      - name: Wait for server to be ready
        run: |
          for port in ${{ matrix.server.query_port }} ${{ matrix.server.query_ssh_port }}; do
            for i in $(seq 1 60); do
              if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then
                echo "query port $port answered after ${i}s"
                continue 2
              fi
              sleep 1
            done
            echo "the query port $port did not answer within 60s" >&2
            exit 1
          done
      # The suite needs channels, permissions and relaxed antiflood. Skipping
      # this is how the tests pass while testing nothing: they skip on
      # permissions instead of failing, which hid a row-parsing bug for months.
      - name: Provision the fixture
        env:
          # Outside the checkout, so the fixture leaves the working tree clean.
          TS3_FIXTURE_ENV: ${{ runner.temp }}/ts3-fixture.env
        run: |
          sudo apt-get install -y netcat-openbsd >/dev/null
          TS3_QUERY_HOST='${{ matrix.server.query_host }}' \
          TS3_QUERY_HTTP='${{ matrix.server.query_http }}' \
          TS3_QUERY_PORT='${{ matrix.server.query_port }}' \
          TS3_QUERY_SSH_PORT='${{ matrix.server.query_ssh_port }}' \
          TS3_QUERY_SSH_PASSWORD=ci-serveradmin-password \
          TS3_ADMIN_PW=ci-serveradmin-password \
          TS3_QUERY_GUEST='${{ matrix.server.query_guest }}' \
          ./scripts/ts3-fixture.sh
      - name: Run integration tests
        env:
          # Where the fixture wrote its environment file.
          TS3_FIXTURE_ENV: ${{ runner.temp }}/ts3-fixture.env
        run: |
          set -a
          . "$TS3_FIXTURE_ENV"
          set +a
          # One package at a time (-p 1): they all use the one live server,
          # and server-wide state or load from one must not reach another.
          # -timeout applies to each package on its own, so it is unchanged.
          go test -v -race -p 1 -tags integration -timeout 300s ./...
      # The destructive instance tests (stopping and deleting virtual servers,
      # restoring a snapshot, resetting permissions, stopping the process) run
      # against the job's own throwaway server, in a step of their own after
      # everything above: they sort ahead of other serverquery tests, and
      # StopInstance ends the server, so nothing can run after it. Within this
      # step the permission reset runs first and StopInstance last.
      - name: Run instance tests
        env:
          TS3_FIXTURE_ENV: ${{ runner.temp }}/ts3-fixture.env
        run: |
          set -a
          . "$TS3_FIXTURE_ENV"
          set +a
          TEAMSPEAK_QUERY_DESTRUCTIVE=1 TEAMSPEAK_QUERY_STOP_INSTANCE=1 \
            go test -v -race -count=1 -tags integration -timeout 300s -run '^TestInstance' ./serverquery/
      # Two WebRTC peers carry a stream over the live server, with the stream
      # package doing the signalling. A module of its own, so it is not part of
      # ./... above.
      - name: Run the WebRTC end-to-end test
        if: matrix.server.name == 'TS6'
        working-directory: stream/e2e
        env:
          TS3_FIXTURE_ENV: ${{ runner.temp }}/ts3-fixture.env
        run: |
          set -a
          . "$TS3_FIXTURE_ENV"
          set +a
          go test -v -race -count=1 -tags integration -timeout 120s ./...
