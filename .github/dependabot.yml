version: 2
updates:
  # Monitor Go dependencies (go.mod)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Group minor and patch updates to reduce the number of PRs and branches
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The WebRTC end-to-end test is a module of its own, so the stack it needs
  # stays out of the SDK's dependencies.
  - package-ecosystem: "gomod"
    directory: "/stream/e2e"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The server images the integration job runs against, and the nginx front.
  # CI reads them from ci/images (scripts/ci-image.sh), as Dependabot only
  # looks at Dockerfiles, not at `services` or `docker run` in a workflow.
  - package-ecosystem: "docker"
    directory: "/ci/images"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # Monitor GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # The codeql-action steps of one workflow must run the same version, so
    # they are bumped together, in one pull request with the other actions.
    groups:
      github-actions:
        patterns:
          - "*"
